weddingos:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'weddingos') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'weddingos_local') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'weddingos') }}"
      schema: staging
      threads: 4
