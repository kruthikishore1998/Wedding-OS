version: 2

sources:
  - name: raw
    schema: raw
    description: Fake source system for WeddingOS (venues, vendors, quotes).
    config:
      loaded_at_field: updated_at
      freshness:
        warn_after: {count: 7, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: venues
      - name: vendors
      - name: quotes
      - name: quote_line_items
